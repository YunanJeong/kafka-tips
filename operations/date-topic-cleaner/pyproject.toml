[project]
name = "date-topic-cleaner"
version = "0.1.0"
description = "오래된 날짜토픽(_YYYY_MM_DD, _YYYY_MM) 자동 삭제"
requires-python = ">=3.10"
dependencies = [
    "confluent-kafka>=2.5.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["date_topic_cleaner"]

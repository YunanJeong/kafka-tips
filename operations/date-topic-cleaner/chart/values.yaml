image:
  repository: date-topic-cleaner
  # 비우면 Chart.appVersion 을 쓴다
  tag: ""
  pullPolicy: IfNotPresent

# 매월 25일 04:17
schedule: "17 4 25 * *"
timeZone: Asia/Seoul

# 몇 달 전 날짜토픽을 삭제할지. 2 이면 2026-09-25 실행시 2026-07 전체가 대상.
targetMonthsAgo: 2

broker: kafka:9092
connectUrl: http://kafka-connect:8083

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

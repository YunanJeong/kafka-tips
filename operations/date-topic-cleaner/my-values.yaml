# helm upgrade --install date-topic-cleaner date-topic-cleaner-0.1.0.tgz -f my-values.yaml
# 나머지 값은 chart/values.yaml 기본값을 쓴다.
image:
  repository: <REGISTRY>/date-topic-cleaner

# 매월 25일 04:17
schedule: "17 4 25 * *"
timeZone: Asia/Seoul

# 몇 달 전 날짜토픽을 삭제할지. 2 이면 2026-09-25 실행시 2026-07 전체가 대상.
targetMonthsAgo: 2

broker: <BROKER>:9092
connectUrl: http://<CONNECT>:8083
